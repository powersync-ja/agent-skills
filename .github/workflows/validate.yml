name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository metadata and references
        run: pnpm validate
      - name: Build discovery release artifacts
        env:
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: powersync-ja/agent-skills
          RELEASE_TAG: v0.0.0-test
        run: pnpm build:release

      - name: Validate SKILL.md (Agent Skills spec)
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ./skills/powersync
          validate-references: true
          fail-on-warning: true
          # when_to_use is a Claude Code extension, not part of the agentskills.io
          # spec, so the action's unknown-field warning must not fail the build.
          ignore-rules: unknown-field
